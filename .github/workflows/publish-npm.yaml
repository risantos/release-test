name: Publish npm

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.2.3
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher accepts this environment and the calling workflow file (release-tag.yaml).
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache in a job with an OIDC token (cache poisoning).
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to match devEngines requirement
        run: npm install -g npm@^12

      - name: Install dependencies
        run: npm ci

      - name: Check npm registry
        id: registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if [[ "$(npm view "$name@$version" version 2> /dev/null)" == "$version" ]]; then
            echo "::notice title=Already on npm::$name@$version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npx release-it --ci --no-increment --config .release-it.publish-npm.ts
