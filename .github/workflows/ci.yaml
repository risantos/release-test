name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Update npm to match devEngines requirement
        run: npm install -g npm@^12

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc
