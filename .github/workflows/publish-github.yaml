name: Publish GitHub

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.2.3
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # release-it comments on the issues and pull requests in the release.
      issues: write
      pull-requests: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache in a job with a write token (cache poisoning).
          package-manager-cache: false

      - name: Update npm to match devEngines requirement
        run: npm install -g npm@^12

      - name: Install dependencies
        run: npm ci

      - name: Check GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")

          # release-it names the release from package.json. For a tag that is not on GitHub, GitHub makes a new tag on the default branch.
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error title=Version mismatch::Tag $TAG does not match package.json version $version"
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice title=Already on GitHub::Release $TAG already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx release-it --ci --no-increment --config .release-it.publish-github.ts
