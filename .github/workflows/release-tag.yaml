name: Release Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again, for example v1.2.3
        required: true
        type: string

permissions: {}

concurrency:
  group: release-tag-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    # A tag deletion is also a push event. Do nothing for it.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      private: ${{ steps.package.outputs.private }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Stable versions only: pre-releases are off for now.
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid tag::$TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error title=Tag not on $DEFAULT_BRANCH::The commit of $TAG is not on $DEFAULT_BRANCH"
            exit 1
          fi

          version=$(jq -r .version package.json)

          if [[ "$version" != "${TAG#v}" ]]; then
            echo "::error title=Version mismatch::package.json has $version, but the tag is $TAG"
            exit 1
          fi

      - name: Read package
        id: package
        run: echo "private=$(jq -r '.private // false' package.json)" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: check
    if: needs.check.outputs.private != 'true'
    uses: ./.github/workflows/publish-npm.yaml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish-github:
    needs: [check, publish-npm]
    # Also run when publish-npm was skipped for a private package.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') }}
    uses: ./.github/workflows/publish-github.yaml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
